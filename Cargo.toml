[package]
name = "ogc-edr"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/stratoscale-io/ogc-edr"
homepage = "https://stratoscale.io"
description = "OGC API - Environmental Data Retrieval server over Zarr, backed by zarr-datafusion."

[dependencies]
# Pinned to a revision rather than a crates.io version: the published 0.1.0
# targets datafusion 51 / arrow 57 and lacks `ZarrTable::store_meta`, which is
# how the catalogue learns a store's coordinates. This revision declares the
# same datafusion 54 / arrow 58 as we do. Move to a plain version once a
# release carrying those APIs is published — it should be 0.2.0, since the
# datafusion bump breaks anything depending on 0.1.
zarr-datafusion = { git = "https://github.com/stratoscale-io/zarr-datafusion", rev = "6d1f0de333450e62867e44332d09a41e88340f06" }
arrow = "58"
datafusion = "54.0.0"
axum = "0.8.9"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
chrono = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
# `axum` feature makes Markup an IntoResponse, so handlers can return it directly.
maud = { version = "0.27", features = ["axum"] }
# Same version zarr-datafusion uses, so its `AsyncReadableListableStorage` and our
# raw `.zmetadata` / `.zattrs` reads share one set of storage traits.
zarrs = "0.22.10"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
